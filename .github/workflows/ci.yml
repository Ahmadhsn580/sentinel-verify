name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: shellcheck install.sh uninstall.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest -q

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run suite inside a Termux-like proot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq proot
          mkdir -p rootfs
          curl -fsSL https://raw.githubusercontent.com/termux/proot-distro/master/install.sh \
            | sudo bash -s -- --install ubuntu
          proot-distro login ubuntu --shared-tmp -- bash -lc '
            apt-get update -qq && apt-get install -y -qq python3 python3-venv openssl git
            cd /tmp
            python3 -m venv v && . v/bin/activate
            pip install -q pytest pytest-asyncio
            cd "$GITHUB_WORKSPACE"
            python -m pytest -q
          '
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}