name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: shellcheck install.sh uninstall.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest -q

  termux:
    # Simulates Termux's environment (PREFIX under .../com.termux/files/usr,
    # a separate $HOME) to exercise install.sh's Termux code path and confirm
    # the package honours PREFIX/HOME/XDG_DATA_HOME instead of assuming /tmp
    # or /etc. A real device/proot run isn't practical in CI, and isn't
    # needed to catch the class of bug this job cares about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install under a simulated Termux PREFIX
        run: |
          set -euo pipefail
          export PREFIX="${RUNNER_TEMP}/termux-sim/data/data/com.termux/files/usr"
          export HOME="${RUNNER_TEMP}/termux-sim/home"
          mkdir -p "$PREFIX/bin" "$HOME"
          bash install.sh
          test -x "$PREFIX/bin/sentinel-verify"
          "$PREFIX/bin/sentinel-verify" list-checks
          bash uninstall.sh
          test ! -e "$PREFIX/bin/sentinel-verify"