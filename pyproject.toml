[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-verify"
version = "0.1.0"
description = "Evidence-backed web security verification CLI for Termux and minimal terminals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sentinel-verify contributors" }]
keywords = ["security", "scanner", "termux", "cli", "sarif"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
sentinel-verify = "sentinel.cli:main"

[tool.setuptools]
packages = ["sentinel", "sentinel.checks"]

[tool.setuptools.package-data]
sentinel = ["../profiles/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "C4"]
ignore = ["S101", "S311", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]